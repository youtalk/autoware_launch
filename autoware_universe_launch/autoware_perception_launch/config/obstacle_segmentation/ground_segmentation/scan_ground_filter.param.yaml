/**:
  ros__parameters:
    global_slope_max_angle_deg: 10.0
    local_slope_max_angle_deg: 13.0 # recommended 30.0 for non elevation_grid_mode
    split_points_distance_tolerance: 0.2
    use_virtual_ground_point: True
    split_height_distance: 0.2
    non_ground_height_threshold: 0.20
    grid_size_m: 0.5
    gnd_grid_buffer_size: 4
    detection_range_z_max: 3.5
    elevation_grid_mode: true
    use_recheck_ground_cluster: true
    recheck_start_distance: 20.0
    use_lowest_point: true
    low_priority_region_x: -20.0
    center_pcl_shift: 0.0
    radial_divider_angle_deg: 1.0

    # debug parameters
    publish_processing_time_detail: false

    # QoS override: when this node is the obstacle segmentation terminal (both outlier
    # filters disabled), this reconfigures its output publisher onto the interface spec's
    # RELIABLE / KEEP_LAST / depth 5 QoS via `Filter`'s QosOverridingOptions::with_default_policies().
    # Inert when the resolved output topic is not /perception/obstacle_segmentation/pointcloud
    # (i.e. when an outlier filter stage is the terminal instead).
    qos_overrides:
      /perception/obstacle_segmentation/pointcloud:
        publisher:
          reliability: reliable
          depth: 5
          history: keep_last
